<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行李收纳">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>模块化行李收纳</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-2: #6e6e73;
    --accent: #0071e3;
    --green: #34c759;
    --danger: #d70015;
    --hairline: rgba(60,60,67,.14);
    --tap: rgba(0,0,0,.05);
    --sheet-grip: rgba(60,60,67,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --text-2: #98989f;
      --accent: #0a84ff;
      --green: #30d158;
      --danger: #ff453a;
      --hairline: rgba(84,84,88,.55);
      --tap: rgba(255,255,255,.08);
      --sheet-grip: rgba(235,235,245,.3);
    }
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* ===== 导航栏（大标题 + 进度条） ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(242,242,247,.8);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: calc(8px + env(safe-area-inset-top)) 16px 0;
  }
  @media (prefers-color-scheme: dark) {
    header { background: rgba(0,0,0,.75); }
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 28px; font-weight: 700; margin: 4px 0 8px; letter-spacing: .2px; }
  .nav-btn {
    border: none; background: none; color: var(--accent);
    font-size: 17px; padding: 8px 4px; cursor: pointer; font-family: inherit;
    align-self: flex-start; margin-top: 6px;
  }
  .nav-btn:active { opacity: .4; }
  .progress-line { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
  .progress-bar {
    flex: 1; height: 5px; background: var(--hairline); border-radius: 3px; overflow: hidden;
  }
  .progress-bar > div {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width .25s ease;
  }
  .progress-text { font-size: 13px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ===== 大模块区块 ===== */
  .module { margin-top: 22px; }
  .module-head {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px; cursor: pointer; user-select: none;
    min-height: 44px;
  }
  .module-head:active { opacity: .55; }
  .chev {
    width: 8px; height: 8px; flex-shrink: 0;
    border-right: 2.5px solid var(--text-2); border-bottom: 2.5px solid var(--text-2);
    transform: rotate(45deg); transition: transform .22s ease;
    margin: 0 4px;
  }
  .module.collapsed .chev { transform: rotate(-45deg); }
  .module-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .module-name { font-size: 19px; font-weight: 700; }
  .module-loc {
    font-size: 12px; color: var(--accent); font-weight: 500;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-radius: 6px; padding: 2px 7px;
  }
  .module-count { font-size: 14px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .module.done .module-count { color: var(--green); font-weight: 600; }

  /* 折叠动画 */
  .module-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .25s ease; }
  .module.collapsed .module-body { grid-template-rows: 0fr; }
  .module-body > .inner { overflow: hidden; min-height: 0; }

  /* ===== 小模块卡片 ===== */
  .group { margin-top: 12px; }
  .group-head {
    display: flex; align-items: center; gap: 8px; padding: 0 4px 6px;
  }
  .g-name { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .3px; }
  .g-count { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .group.done .g-count { color: var(--green); font-weight: 600; }
  .card {
    background: var(--card); border-radius: 14px; overflow: hidden;
  }
  @media (prefers-color-scheme: light) {
    .card { box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  }

  /* ===== 物品行 ===== */
  .item {
    display: flex; align-items: center; gap: 13px;
    padding: 13px 16px; min-height: 52px; cursor: pointer;
  }
  .item:not(:first-child) { border-top: 1px solid var(--hairline); }
  .item:active { background: var(--tap); }
  .check {
    width: 25px; height: 25px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #c7c7cc; position: relative;
    transition: background .15s ease, border-color .15s ease;
  }
  @media (prefers-color-scheme: dark) { .check { border-color: #48484a; } }
  .check::after {
    content: ""; position: absolute; left: 7px; top: 3.5px;
    width: 5px; height: 10px;
    border-right: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
    transform: rotate(45deg) scale(0); transition: transform .15s ease;
  }
  .item.checked .check { background: var(--accent); border-color: var(--accent); }
  .item.checked .check::after { transform: rotate(45deg) scale(1); }
  .item .item-name { flex: 1; font-size: 17px; line-height: 1.35; }
  .item.checked .item-name { color: var(--text-2); text-decoration: line-through; }

  /* ===== 编辑模式 ===== */
  .edit-tools { display: none; gap: 2px; align-items: center; flex-shrink: 0; }
  body.editing .edit-tools { display: inline-flex; }
  body.editing .item, body.editing .module-head { cursor: default; }
  .icon-btn {
    border: none; background: none; font-size: 16px; cursor: pointer;
    width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); border-radius: 8px; font-family: inherit;
  }
  .icon-btn.del { color: var(--danger); }
  .icon-btn:active { background: var(--tap); }
  .add-row { display: none; }
  body.editing .add-row { display: block; }
  .add-row .add-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; border: none; background: none; color: var(--accent);
    font-size: 16px; padding: 14px; cursor: pointer; font-family: inherit;
    min-height: 50px;
  }
  .add-row .add-btn:active { background: var(--tap); }
  .add-row.in-card { border-top: 1px solid var(--hairline); }
  .add-row.standalone .add-btn { color: var(--text-2); font-size: 15px; }

  .footer-note { text-align: center; color: var(--text-2); font-size: 12px; margin-top: 28px; }
  .hidden { display: none !important; }

  /* ===== 底部操作栏 ===== */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex;
    background: rgba(242,242,247,.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--hairline);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    .tabbar { background: rgba(28,28,30,.85); }
  }
  .tabbar button {
    flex: 1; border: none; background: none; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 0 6px; font-size: 11px; color: var(--accent);
  }
  .tabbar button .tab-icon { font-size: 20px; line-height: 1; }
  .tabbar button.danger { color: var(--danger); }
  .tabbar button:active { opacity: .4; }

  /* ===== Action Sheet（底部动作菜单） ===== */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.4);
    display: flex; flex-direction: column; justify-content: flex-end;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    margin: 8px 8px calc(8px + env(safe-area-inset-bottom));
    border-radius: 14px; overflow: hidden;
    background: var(--card);
    animation: sheetUp .28s cubic-bezier(.32,.72,.35,1);
  }
  @keyframes sheetUp { from { transform: translateY(110%); } to { transform: translateY(0); } }
  .sheet-title {
    padding: 14px 16px; font-size: 13px; color: var(--text-2);
    text-align: center; line-height: 1.45;
  }
  .sheet-btn {
    display: block; width: 100%; border: none; background: none;
    padding: 16px; font-size: 18px; color: var(--accent);
    border-top: 1px solid var(--hairline); cursor: pointer; font-family: inherit;
  }
  .sheet-btn.destructive { color: var(--danger); }
  .sheet-btn.cancel { font-weight: 600; border-top: none; margin-top: 8px; border-radius: 14px; background: var(--card); }
  .sheet-btn:active { background: var(--tap); }

  /* ===== Alert（居中弹窗，用于输入） ===== */
  .alert-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    padding: 32px; animation: fadeIn .18s ease;
  }
  .alert-card {
    background: var(--card); border-radius: 14px;
    width: 100%; max-width: 300px; overflow: hidden;
    animation: alertIn .22s cubic-bezier(.32,.72,.35,1);
    transform-origin: center;
  }
  @keyframes alertIn { from { transform: scale(1.12); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .alert-body { padding: 18px 16px 14px; text-align: center; }
  .alert-title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .alert-msg { font-size: 13px; color: var(--text-2); margin: 0 0 10px; line-height: 1.45; }
  .alert-input {
    width: 100%; font-size: 15px; border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 10px; font-family: inherit; background: var(--bg); color: var(--text);
  }
  .alert-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .alert-btns { display: flex; border-top: 1px solid var(--hairline); }
  .alert-btns button {
    flex: 1; border: none; background: none; padding: 12px;
    font-size: 17px; color: var(--accent); cursor: pointer; font-family: inherit;
  }
  .alert-btns button + button { border-left: 1px solid var(--hairline); font-weight: 600; }
  .alert-btns button.destructive { color: var(--danger); }
  .alert-btns button:active { background: var(--tap); }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>🧳 行李收纳</h1>
    <button class="nav-btn" id="editToggle">编辑</button>
  </div>
  <div class="progress-line">
    <div class="progress-bar"><div id="overallBar" style="width:0%"></div></div>
    <div class="progress-text" id="overallText">0 / 0</div>
  </div>
</header>

<div class="wrap" id="app"></div>

<div class="wrap footer-note">数据保存在本机 · 默认清单来自《模块化行李收纳.xlsx》</div>

<nav class="tabbar">
  <button id="resetChecks"><span class="tab-icon">⟳</span>重置勾选</button>
  <button id="resetData" class="danger hidden"><span class="tab-icon">↺</span>恢复默认</button>
</nav>

<script>
// ================= 默认数据（来自 Excel 工作表 1） =================
const DEFAULT_DATA = {
  modules: [
    {
      id: "m1", name: "模块1：路上不拿出来的", location: "行李箱",
      groups: [
        { id: "g1_1", name: "1.1 衣物包", items: [
          { id: "i1_1_1", name: "外穿衣物" },
          { id: "i1_1_2", name: "睡衣" },
          { id: "i1_1_3", name: "贴身衣物（内衣/内裤/袜子/毛巾）" }
        ]},
        { id: "g1_2", name: "1.2 洗漱包", items: [
          { id: "i1_2_1", name: "牙套" },
          { id: "i1_2_2", name: "牙刷/牙膏" },
          { id: "i1_2_3", name: "洗发皂" },
          { id: "i1_2_4", name: "耳塞" },
          { id: "i1_2_5", name: "香水" },
          { id: "i1_2_6", name: "眼罩" },
          { id: "i1_2_7", name: "安眠药" },
          { id: "i1_2_8", name: "洗面奶" },
          { id: "i1_2_9", name: "面霜" },
          { id: "i1_2_10", name: "防晒霜" }
        ]},
        { id: "g1_3", name: "1.3 化妆包", items: [
          { id: "i1_3_1", name: "水粉霜" },
          { id: "i1_3_2", name: "卸妆湿巾" },
          { id: "i1_3_3", name: "散粉" },
          { id: "i1_3_4", name: "眉笔" },
          { id: "i1_3_5", name: "口红" }
        ]},
        { id: "g1_4", name: "1.4 充电包", items: [
          { id: "i1_4_1", name: "两用充电头" },
          { id: "i1_4_2", name: "手机充电线" }
        ]}
      ]
    },
    {
      id: "m2", name: "模块2：路上要用到的", location: "背包",
      groups: [
        { id: "g2_1", name: "2.1 护理包", items: [
          { id: "i2_1_1", name: "湿纸巾" },
          { id: "i2_1_2", name: "纸巾" },
          { id: "i2_1_3", name: "防晒口罩" },
          { id: "i2_1_4", name: "发绳" },
          { id: "i2_1_5", name: "润唇膏" },
          { id: "i2_1_6", name: "护手霜" },
          { id: "i2_1_7", name: "香茅膏" }
        ]},
        { id: "g2_2", name: "2.2 电子包", items: [
          { id: "i2_2_1", name: "充电宝" },
          { id: "i2_2_2", name: "Kindle" },
          { id: "i2_2_3", name: "蓝牙耳机" }
        ]},
        { id: "g2_3", name: "2.3 肩颈健康", items: [
          { id: "i2_3_1", name: "颈托" },
          { id: "i2_3_2", name: "筋膜球" },
          { id: "i2_3_3", name: "充气瑜伽球" }
        ]},
        { id: "g2_4", name: "2.4 钛水壶", items: [ { id: "i2_4_1", name: "钛水壶" } ]}
      ]
    },
    {
      id: "m3", name: "模块3：安检要拿出来的", location: "行李箱外层",
      groups: [
        { id: "g3_1", name: "3.1 电脑", items: [ { id: "i3_1_1", name: "电脑" } ]},
        { id: "g3_2", name: "3.2 雨伞", items: [ { id: "i3_2_1", name: "雨伞" } ]}
      ]
    }
  ]
};

// ================= 状态存取 =================
const LS_DATA = "luggage.data.v2";
const LS_CHECK = "luggage.checked.v2";

function loadData() {
  try {
    const raw = localStorage.getItem(LS_DATA);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.modules)) return d;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData() { safeSet(LS_DATA, JSON.stringify(state.data)); }
function loadChecked() {
  try { return JSON.parse(localStorage.getItem(LS_CHECK)) || {}; } catch (e) { return {}; }
}
function saveChecked() { safeSet(LS_CHECK, JSON.stringify(state.checked)); }

// 存储失败（无痕模式等）时提示一次
let storageWarned = false;
function safeSet(key, val) {
  try {
    localStorage.setItem(key, val);
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      showSheet({ title: "当前浏览器无法保存数据（可能是无痕/隐私模式），本次修改在关闭页面后会丢失。建议用普通模式打开。", actions: [{ label: "知道了", style: "cancel", value: true }] });
    }
  }
}

const state = {
  data: loadData(),
  checked: loadChecked(),
  editing: false,
  collapsed: {}   // moduleId -> true
};

function uid(prefix) {
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function haptic() { if (navigator.vibrate) navigator.vibrate(8); }

// ================= 渲染 =================
const app = document.getElementById("app");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function makeIconBtn(label, cls, onClick) {
  const b = el("button", "icon-btn" + (cls ? " " + cls : ""), label);
  b.type = "button";
  b.addEventListener("click", ev => { ev.stopPropagation(); onClick(); });
  return b;
}

// ================= Action Sheet / Alert =================
// 底部动作菜单：opts { title, actions: [{label, style: 'default'|'destructive'|'cancel', value}] }
function showSheet(opts) {
  return new Promise(resolve => {
    const overlay = el("div", "sheet-overlay");
    const sheet = el("div", "sheet");
    if (opts.title) sheet.appendChild(el("div", "sheet-title", opts.title));
    opts.actions.forEach((a, i) => {
      const b = el("button", "sheet-btn" + (a.style === "destructive" ? " destructive" : "") + (a.style === "cancel" ? " cancel" : ""), a.label);
      b.type = "button";
      b.addEventListener("click", () => { overlay.remove(); resolve(a.value); });
      sheet.appendChild(b);
    });
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
    overlay.addEventListener("click", ev => {
      if (ev.target === overlay) { overlay.remove(); resolve(undefined); }
    });
  });
}

// 居中输入弹窗：resolve 输入字符串或 null（取消）
function showAlertInput(title, message, value) {
  return new Promise(resolve => {
    const overlay = el("div", "alert-overlay");
    const card = el("div", "alert-card");
    const body = el("div", "alert-body");
    body.appendChild(el("p", "alert-title", title));
    if (message) body.appendChild(el("p", "alert-msg", message));
    const input = el("input", "alert-input");
    input.value = value || "";
    input.enterKeyHint = "done";
    body.appendChild(input);
    card.appendChild(body);
    const btns = el("div", "alert-btns");
    const cancelBtn = el("button", "", "取消");
    cancelBtn.type = "button";
    const okBtn = el("button", "", "确定");
    okBtn.type = "button";
    btns.appendChild(cancelBtn);
    btns.appendChild(okBtn);
    card.appendChild(btns);
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    const close = v => { overlay.remove(); resolve(v); };
    cancelBtn.addEventListener("click", () => close(null));
    okBtn.addEventListener("click", () => close(input.value.trim()));
    overlay.addEventListener("click", ev => { if (ev.target === overlay) close(null); });
    input.addEventListener("keydown", ev => { if (ev.key === "Enter") close(input.value.trim()); });
    input.focus();
    input.select();
  });
}

function confirmDlg(message, danger) {
  return showSheet({
    title: message,
    actions: [
      { label: "确定", style: danger ? "destructive" : "default", value: true },
      { label: "取消", style: "cancel", value: false }
    ]
  });
}
function promptDlg(title, value, message) { return showAlertInput(title, message, value); }

// ================= 渲染 =================
function render() {
  app.innerHTML = "";
  let totalItems = 0, totalChecked = 0;

  state.data.modules.forEach(mod => {
    let mTotal = 0, mChecked = 0;
    mod.groups.forEach(g => g.items.forEach(it => {
      mTotal++;
      if (state.checked[it.id]) mChecked++;
    }));
    totalItems += mTotal; totalChecked += mChecked;

    const modEl = el("div", "module" + (state.collapsed[mod.id] ? " collapsed" : "") + (mTotal > 0 && mChecked === mTotal ? " done" : ""));
    modEl.dataset.mid = mod.id;

    // ---- 大模块头 ----
    const head = el("div", "module-head");
    head.appendChild(el("span", "chev"));
    const title = el("div", "module-title");
    title.appendChild(el("span", "module-name", mod.name));
    if (mod.location) title.appendChild(el("span", "module-loc", "📍 " + mod.location));
    head.appendChild(title);
    head.appendChild(el("span", "module-count", mChecked + " / " + mTotal));

    const mTools = el("span", "edit-tools");
    mTools.appendChild(makeIconBtn("✏️", "", async () => {
      const v = await promptDlg("重命名大模块", null, mod.name);
      if (v) { mod.name = v; saveData(); render(); }
    }));
    mTools.appendChild(makeIconBtn("📍", "", async () => {
      const v = await promptDlg("收纳位置", "留空则移除", mod.location || "");
      if (v !== null) { mod.location = v; saveData(); render(); }
    }));
    mTools.appendChild(makeIconBtn("🗑", "del", async () => {
      if (await confirmDlg("删除「" + mod.name + "」及其下所有物品？", true)) {
        state.data.modules = state.data.modules.filter(m => m.id !== mod.id);
        saveData(); render();
      }
    }));
    head.appendChild(mTools);
    head.addEventListener("click", () => {
      if (state.editing) return;
      state.collapsed[mod.id] = !state.collapsed[mod.id];
      modEl.classList.toggle("collapsed");
    });
    modEl.appendChild(head);

    // ---- 小模块 ----
    const body = el("div", "module-body");
    const inner = el("div", "inner");
    mod.groups.forEach(grp => {
      const gChecked = grp.items.filter(it => state.checked[it.id]).length;
      const gEl = el("div", "group" + (grp.items.length > 0 && gChecked === grp.items.length ? " done" : ""));

      const gHead = el("div", "group-head");
      gHead.appendChild(el("span", "g-name", grp.name));
      gHead.appendChild(el("span", "g-count", gChecked + "/" + grp.items.length));

      const gTools = el("span", "edit-tools");
      gTools.appendChild(makeIconBtn("✏️", "", async () => {
        const v = await promptDlg("重命名小模块", null, grp.name);
        if (v) { grp.name = v; saveData(); render(); }
      }));
      gTools.appendChild(makeIconBtn("🗑", "del", async () => {
        if (await confirmDlg("删除「" + grp.name + "」及其下所有物品？", true)) {
          mod.groups = mod.groups.filter(g => g.id !== grp.id);
          saveData(); render();
        }
      }));
      gHead.appendChild(gTools);
      gEl.appendChild(gHead);

      const card = el("div", "card");

      // ---- 物品 ----
      grp.items.forEach(item => {
        const row = el("div", "item" + (state.checked[item.id] ? " checked" : ""));
        row.appendChild(el("span", "check"));
        row.appendChild(el("span", "item-name", item.name));

        const iTools = el("span", "edit-tools");
        iTools.appendChild(makeIconBtn("✏️", "", async () => {
          const v = await promptDlg("重命名物品", null, item.name);
          if (v) { item.name = v; saveData(); render(); }
        }));
        iTools.appendChild(makeIconBtn("🗑", "del", () => {
          grp.items = grp.items.filter(i => i.id !== item.id);
          delete state.checked[item.id];
          saveData(); saveChecked(); render();
        }));
        row.appendChild(iTools);

        row.addEventListener("click", () => {
          if (state.editing) return;
          onCheck(item.id, !state.checked[item.id]);
        });
        card.appendChild(row);
      });

      // 添加物品
      const addItem = el("div", "add-row in-card");
      const addItemBtn = el("button", "add-btn", "＋ 添加物品");
      addItemBtn.type = "button";
      addItemBtn.addEventListener("click", () => {
        grp.items.push({ id: uid("i"), name: "新物品" });
        saveData(); render();
      });
      addItem.appendChild(addItemBtn);
      card.appendChild(addItem);

      gEl.appendChild(card);
      inner.appendChild(gEl);
    });

    // 添加小模块
    const addGroup = el("div", "add-row standalone");
    const addGroupBtn = el("button", "add-btn", "＋ 添加小模块");
    addGroupBtn.type = "button";
    addGroupBtn.addEventListener("click", () => {
      mod.groups.push({ id: uid("g"), name: "新小模块", items: [] });
      saveData(); render();
    });
    addGroup.appendChild(addGroupBtn);
    inner.appendChild(addGroup);

    body.appendChild(inner);
    modEl.appendChild(body);
    app.appendChild(modEl);
  });

  // 添加大模块
  const addModWrap = el("div", "add-row standalone");
  const addModBtn = el("button", "add-btn", "＋ 添加大模块");
  addModBtn.type = "button";
  addModBtn.addEventListener("click", () => {
    state.data.modules.push({ id: uid("m"), name: "新大模块", location: "", groups: [] });
    saveData(); render();
  });
  addModWrap.appendChild(addModBtn);
  app.appendChild(addModWrap);

  // 总进度
  const pct = totalItems ? Math.round(totalChecked / totalItems * 100) : 0;
  document.getElementById("overallBar").style.width = pct + "%";
  document.getElementById("overallText").textContent = totalChecked + " / " + totalItems + (pct === 100 && totalItems > 0 ? " ✅" : "");
}

function onCheck(id, val) {
  if (val) state.checked[id] = true; else delete state.checked[id];
  saveChecked();
  haptic();
  render(); // 简单起见整体重绘，进度即时更新
}

// ================= 编辑 / 底部操作栏 =================
const editToggle = document.getElementById("editToggle");
const resetChecks = document.getElementById("resetChecks");
const resetData = document.getElementById("resetData");

editToggle.addEventListener("click", () => {
  state.editing = !state.editing;
  document.body.classList.toggle("editing", state.editing);
  editToggle.textContent = state.editing ? "完成" : "编辑";
  resetData.classList.toggle("hidden", !state.editing);
});

resetChecks.addEventListener("click", async () => {
  if (await confirmDlg("清空所有勾选，开始新一轮打包？")) {
    state.checked = {};
    saveChecked(); render();
  }
});

resetData.addEventListener("click", async () => {
  if (await confirmDlg("恢复为 Excel 默认清单？你的自定义修改和勾选都会被清除。", true)) {
    state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    state.checked = {};
    saveData(); saveChecked(); render();
  }
});

render();

// 注册 Service Worker（PWA 离线支持）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
